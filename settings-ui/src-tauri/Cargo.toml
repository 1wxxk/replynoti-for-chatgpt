[package]
name = "replynoti-settings"
version = "0.1.0-beta.10"
edition = "2024"
license = "MIT"
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
image = { version = "=0.25.9", default-features = false, features = ["png", "ico"] }
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Registry", "Win32_Media_Audio", "Win32_System_Threading", "Win32_System_RemoteDesktop"] }
[profile.release]
opt-level = 2
strip = true
